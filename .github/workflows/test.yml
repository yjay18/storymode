name: Quality & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality & Smoke Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: "pyproject.toml"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Sync dependencies
        run: uv sync --locked --no-install-project --all-groups

      - name: Scaffold check
        run: uv run --no-sync python scripts/check_scaffold.py

      - name: Schema drift check
        run: uv run --no-sync python scripts/generate_schemas.py --check

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Ruff linter check
        run: uv run --no-sync ruff check .

      - name: Mypy strict type check
        run: uv run --no-sync mypy src tests scripts

      - name: Pytest test suite
        run: uv run --no-sync pytest tests/ -q

      - name: End-to-end smoke verification
        run: uv run --no-sync python scripts/run_smoke_test.py

  frontend:
    name: Frontend UI Quality & Build Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bce96c5465dc8ee9832be0b2 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "src/ui/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest test suite
        run: npm run test

      - name: Production bundle build
        run: npm run build
